# Relay pipeline. Generated by /relay:init; do not edit by hand, regenerate.
# Every job is `relay stage <name>`; the logic lives in the relay binary on
# the runner and in the Relay plugin for Claude Code. Protocol: docs/protocol.md
# of https://github.com/masteine/relay.
name: relay

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: number
      stage:
        description: Stage to run (and everything after it up to the next gate)
        required: true
        type: choice
        options: [discuss, ticket, triage, plan]

permissions:
  issues: write
  contents: write
  actions: read

# One run at a time per Issue. GitHub keeps one pending run per group and
# cancels older pending ones, so `relay stage route` decides from the Issue
# state, not from the event that woke it.
concurrency:
  group: relay-${{ github.repository }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

env:
  RELAY_PROTOCOL: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  route:
    # Private repositories only: in a public one anyone could wake the runner.
    if: ${{ github.event.repository.private && (github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request) }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 3
    outputs:
      stages: ${{ steps.r.outputs.stages }}
      issue: ${{ steps.r.outputs.issue }}
    steps:
      # No checkout: route reads relay.yml through the API. A sparse
      # checkout here would leave the shared workspace of a self-hosted
      # runner sparse for the next job.
      - id: r
        run: relay stage route

  discuss:
    needs: [route]
    if: ${{ !cancelled() && contains(fromJSON(needs.route.outputs.stages || '[]'), 'discuss') }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: relay stage discuss --issue ${{ needs.route.outputs.issue }} --deadline 13m

  ticket:
    needs: [route]
    if: ${{ !cancelled() && contains(fromJSON(needs.route.outputs.stages || '[]'), 'ticket') }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: relay stage ticket --issue ${{ needs.route.outputs.issue }} --deadline 13m

  triage:
    needs: [route, ticket]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.ticket.result) && contains(fromJSON(needs.route.outputs.stages || '[]'), 'triage') }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: relay stage triage --issue ${{ needs.route.outputs.issue }} --deadline 18m

  plan:
    needs: [route, triage]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.triage.result) && contains(fromJSON(needs.route.outputs.stages || '[]'), 'plan') }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: relay stage plan --issue ${{ needs.route.outputs.issue }} --deadline 42m

  approve:
    needs: [route]
    if: ${{ !cancelled() && contains(fromJSON(needs.route.outputs.stages || '[]'), 'approve') }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 3
    steps:
      - run: relay stage approve --issue ${{ needs.route.outputs.issue }}

  # Posts "## Relay · error" and sets relay:failed when a stage failed or was
  # cancelled by its timeout, unless the stage already did that itself.
  report-failure:
    needs: [route, discuss, ticket, triage, plan, approve]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: [self-hosted, relay]
    timeout-minutes: 3
    env:
      ISSUE: ${{ needs.route.outputs.issue || github.event.issue.number || inputs.issue }}
      RELAY_NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: relay stage report-failure --issue "$ISSUE"
